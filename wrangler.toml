name = "practice-tracker"
main = "src/index.ts"
compatibility_date = "2026-08-28"

[vars]
TIMEZONE = "Europe/Lisbon"
# The all-time PNG (design section 6.2) is OFF by default because rasterising
# it costs ~20 ms CPU and the free plan allows 10 ms per invocation. /stats
# sends its text views either way. Set to "on" only on a paid plan, where the
# default budget is 30 s. Measured figures are in README.md.
CHART_IMAGE = "off"

[[d1_databases]]
binding = "DB"
database_name = "practice-tracker"
# Created 2026-09-12 in region WEUR. Local dev ignores this id.
database_id = "67a18644-bd1c-45c6-87f1-91da65e54093"

# Secrets, set with `wrangler secret put <NAME>` (never in this file):
#   BOT_TOKEN        - from @BotFather
#   WEBHOOK_SECRET   - random string, also passed to setWebhook
#   ALLOWED_USER_ID  - your numeric Telegram user id, from @userinfobot
#
# ALLOWED_USER_ID is a secret rather than a [vars] entry only because this
# repository is public: it is an identifier, not a credential, but there is no
# reason to publish it. Workers resolves secrets and vars through the same
# `env`, so the code is identical either way.

# The vendored font ships as a byte array (see vendor/PROVENANCE.txt).
# resvg cannot render <text> without font data.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true
